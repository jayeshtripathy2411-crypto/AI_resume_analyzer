<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | AI Resume Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; }
    .auth-card { width: min(100% - 2rem, 440px); border: 0; border-radius: 18px; box-shadow: 0 12px 35px #172b4d12; }
  </style>
</head>
<body>
  <main class="card auth-card p-4 p-md-5">
    <h1 class="h3 mb-2">Welcome back</h1>
    <p class="text-secondary mb-4">Log in to use your AI Resume Analyzer.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="text-center mt-4 mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    <p class="text-center mt-3 mb-0"><a href="{{ url_for('home') }}">Back to analyzer</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
